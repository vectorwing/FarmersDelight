modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license="${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "${port_source_url}"
logoFile = "logo.png"
logoBlur = false
credits = "Original project by vectorwing. Upstream contributors: Chloe Dawn, Grimmauld, CDAGaming, TelepathicGrunt, XFactHD, GizmoThemoonPig, ConductiveFoam, simibubi, MerchantPug, Jozufozu, bagel, Silk, SkySom, Eutro, RaymondBlaze and many others. Unofficial NeoForge 26.2 port maintained by ${port_maintainer}. No affiliation or endorsement."
authors = "${mod_authors}"
description = "${mod_description}"
enumExtensions="META-INF/enumextensions.json"
## Catalogue mod compatibility
itemIcon = "farmersdelight:stove"
configBackground = "minecraft:textures/block/bricks.png"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange="${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"
